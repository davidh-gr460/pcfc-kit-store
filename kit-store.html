<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCFC Kit Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --pitch-900: #12261F;
    --pitch-800: #16302A;
    --pitch-600: #2F6F52;
    --pitch-500: #3A8763;
    --chalk-100: #F6F4EE;
    --chalk-200: #EDEAE0;
    --line: #D8D3C6;
    --ink: #1B231F;
    --ink-soft: #5B6660;
    --tag-amber: #B4671E;
    --tag-amber-bg: #F7E9D8;
    --tag-red: #A23B2B;
    --tag-red-bg: #F6E0DB;
    --tag-green-bg: #E3EEE6;
    --card-bg: #FFFFFF;
    --shadow: none;
    --radius: 3px;
    --focus: #2F6F52;

    --bg: var(--chalk-100);
    --text: var(--ink);
    --text-soft: var(--ink-soft);
    --panel: var(--card-bg);
    --border: var(--line);
    --sidebar-bg: var(--pitch-800);
    --sidebar-text: #E9EEE9;
    --sidebar-text-dim: #9CB0A5;
    --accent: var(--pitch-600);
    --accent-text: #FFFFFF;

    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101512;
      --text: #EDEFEC;
      --text-soft: #9AA69E;
      --panel: #182019;
      --border: #2C3730;
      --sidebar-bg: #0D1512;
      --sidebar-text: #E9EEE9;
      --sidebar-text-dim: #7E9188;
      --accent: #3A8763;
      --accent-text: #06110C;
      --tag-amber-bg: #3A2A12;
      --tag-red-bg: #3A1B16;
      --tag-green-bg: #16281C;
      --tag-amber: #E0A868;
      --tag-red: #E08A78;
      --chalk-200: #22302A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101512;
    --text: #EDEFEC;
    --text-soft: #9AA69E;
    --panel: #182019;
    --border: #2C3730;
    --sidebar-bg: #0D1512;
    --sidebar-text: #E9EEE9;
    --sidebar-text-dim: #7E9188;
    --accent: #3A8763;
    --accent-text: #06110C;
    --tag-amber-bg: #3A2A12;
    --tag-red-bg: #3A1B16;
    --tag-green-bg: #16281C;
    --tag-amber: #E0A868;
    --tag-red: #E08A78;
    --chalk-200: #22302A;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--bg);
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  h1, h2, h3, .label-font {
    font-family: 'Oswald', 'Inter', system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

  a { color: inherit; }
  button, input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  #app { min-height: 100%; display: flex; flex-direction: column; }

  /* ---- Top bar ---- */
  .topbar {
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 3px solid var(--pitch-600);
  }
  .topbar .club {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #clubLogo { height: 32px; width: auto; max-width: 60px; object-fit: contain; border-radius: 3px; flex-shrink: 0; }
  .topbar h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
  }
  .topbar .sub {
    font-size: 0.8rem;
    color: var(--sidebar-text-dim);
  }
  .stat-strip {
    display: flex;
    gap: 18px;
    font-size: 0.82rem;
  }
  .stat-strip .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat-strip .num { font-family: 'Oswald', sans-serif; font-size: 1.15rem; line-height: 1; }
  .stat-strip .stat.overdue .num { color: #E08A78; }

  /* ---- Layout ---- */
  .shell {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  nav.sidebar {
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    width: 190px;
    flex-shrink: 0;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  nav.sidebar button {
    background: transparent;
    border: none;
    color: var(--sidebar-text-dim);
    text-align: left;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 0.92rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  nav.sidebar button:hover { background: rgba(255,255,255,0.06); color: var(--sidebar-text); }
  nav.sidebar button.active { background: var(--pitch-600); color: #fff; }
  nav.sidebar button .count {
    margin-left: auto;
    font-size: 0.72rem;
    opacity: 0.85;
  }

  main {
    flex: 1;
    padding: 22px 26px 60px;
    overflow-y: auto;
    min-width: 0;
  }
  main h2 {
    margin: 0 0 4px;
    font-size: 1.4rem;
    font-weight: 600;
  }
  main .tab-desc { color: var(--text-soft); font-size: 0.92rem; margin: 0 0 20px; max-width: 60ch; }

  /* mobile tab bar */
  .mobile-tabs { display: none; }

  @media (max-width: 820px) {
    .shell { flex-direction: column; }
    nav.sidebar {
      display: none;
    }
    .mobile-tabs {
      display: flex;
      overflow-x: auto;
      background: var(--sidebar-bg);
      padding: 8px 10px;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .mobile-tabs button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--sidebar-text-dim);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .mobile-tabs button.active { background: var(--pitch-600); color: #fff; border-color: transparent; }
    main { padding: 18px 16px 50px; }
    .topbar { flex-wrap: wrap; }
    .stat-strip { gap: 12px; }
  }

  /* ---- Panels & cards ---- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 3px solid var(--pitch-600);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .panel h3 {
    margin: 0 0 14px;
    font-size: 1.02rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

  /* ---- Forms ---- */
  .field { margin-bottom: 13px; }
  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
  }
  .field .hint, p.hint { font-size: 0.75rem; color: var(--text-soft); margin: 4px 0 10px; }
  .quick-picks { display: flex; gap: 6px; margin-top: 6px; }
  .quick-pick-btn {
    background: var(--chalk-200);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 600;
  }
  .quick-pick-btn:hover { background: var(--tag-green-bg); border-color: var(--pitch-600); }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 0.92rem;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.danger { background: var(--tag-red); color: #fff; }
  .btn.small { padding: 6px 11px; font-size: 0.8rem; }

  /* ---- Tables ---- */
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th {
    text-align: left;
    font-weight: 600;
    color: var(--text-soft);
    font-size: 0.75rem;
    border-bottom: 1px solid var(--border);
    padding: 6px 10px;
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }
  .empty-row td { color: var(--text-soft); font-style: italic; padding: 18px 10px; }

  .tag-chip {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.78rem;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--chalk-200);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .status-chip {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-chip.in-store { background: var(--tag-green-bg); color: var(--pitch-600); }
  .status-chip.checked-out { background: var(--tag-amber-bg); color: var(--tag-amber); }
  .status-chip.overdue { background: var(--tag-red-bg); color: var(--tag-red); }

  /* ---- Picker list (checkout/checkin equipment select) ---- */
  .picker { border: 1px solid var(--border); border-radius: var(--radius); max-height: 260px; overflow-y: auto; }
  .picker-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .picker-item:last-child { border-bottom: none; }
  .picker-item.selected { background: var(--tag-green-bg); }
  .picker-item .info { min-width: 0; }
  .picker-item .info .t { font-weight: 600; font-size: 0.9rem; }
  .picker-item .info .m { font-size: 0.78rem; color: var(--text-soft); }
  .picker-empty { padding: 20px 12px; color: var(--text-soft); font-style: italic; font-size: 0.88rem; }
  .picker-section-label {
    padding: 7px 12px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-soft);
    background: var(--chalk-200);
    border-bottom: 1px solid var(--border);
  }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 22px 16px;
    text-align: center;
    color: var(--text-soft);
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone:hover, .dropzone.dragover { border-color: var(--pitch-600); background: var(--tag-green-bg); }
  .dropzone strong { color: var(--text); }
  .logo-preview-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .logo-preview-row img { height: 56px; width: auto; max-width: 120px; object-fit: contain; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; padding: 4px; }

  /* ---- Signature ---- */
  .sig-wrap { border: 1px solid var(--border); border-radius: var(--radius); background: #fff; touch-action: none; }
  canvas#sigCanvas { display: block; width: 100%; height: 150px; cursor: crosshair; }
  .sig-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .agreement {
    font-size: 0.82rem;
    color: var(--text-soft);
    background: var(--chalk-200);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .agreement label { display: flex; gap: 8px; align-items: flex-start; font-size: 0.85rem; color: var(--text); cursor: pointer; }
  .agreement input[type="checkbox"] { width: auto; margin-top: 3px; }

  /* ---- Banners / toast ---- */
  .banner { padding: 10px 14px; border-radius: var(--radius); font-size: 0.86rem; margin-bottom: 14px; }
  .banner.error { background: var(--tag-red-bg); color: var(--tag-red); }
  .banner.info { background: var(--tag-amber-bg); color: var(--tag-amber); }

  #toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--pitch-800);
    color: #fff;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 0.86rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--tag-red); }

  .conn-block {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    text-align: center;
  }
  .conn-block .box { max-width: 380px; }
  .conn-block h2 { margin-bottom: 8px; }
  .conn-block p { color: var(--text-soft); font-size: 0.9rem; }

  .lock-screen {
    position: fixed;
    inset: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .lock-box { max-width: 300px; width: 100%; text-align: center; }
  .lock-box h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .lock-box p { color: var(--sidebar-text-dim); font-size: 0.85rem; margin: 0 0 18px; }
  .lock-box input {
    width: 100%;
    text-align: center;
    letter-spacing: 0.3em;
    font-size: 1.3rem;
    padding: 12px 10px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #fff;
    margin-bottom: 12px;
  }
  .lock-box .err { color: #E08A78; font-size: 0.82rem; min-height: 18px; margin-bottom: 8px; }
  .lock-box .btn { width: 100%; justify-content: center; }
  @keyframes shake { 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
  .lock-box.shake { animation: shake 0.4s; }

  .authoriser-row, .team-tag-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .authoriser-row:last-child { border-bottom: none; }

  .chain-timeline { display: flex; flex-direction: column; }
  .chain-hop { display: flex; gap: 12px; align-items: flex-start; }
  .chain-hop-num {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--pitch-600);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: 'Oswald', sans-serif;
  }
  .chain-hop-body { padding-bottom: 2px; font-size: 0.9rem; }
  .chain-hop-meta { font-size: 0.78rem; color: var(--text-soft); margin-top: 2px; }
  .chain-connector { width: 24px; height: 14px; border-left: 2px solid var(--border); margin-left: 11px; }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-soft);
    padding: 4px 8px;
    border-radius: var(--radius);
    font-size: 0.9rem;
  }
  .icon-btn:hover { color: var(--tag-red); background: var(--tag-red-bg); }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="club">
      <img id="clubLogo" alt="Club badge" style="display:none;">
      <h1>PCFC Kit Store</h1>
      <span class="sub">Equipment check-out register</span>
    </div>
    <div class="stat-strip" id="statStrip"></div>
  </div>

  <div class="mobile-tabs" id="mobileTabs"></div>

  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="toast"></div>
<datalist id="nameList"></datalist>
<datalist id="teamList"></datalist>
<datalist id="locationList"></datalist>
<div class="lock-screen" id="lockScreen">
  <div class="lock-box" id="lockBox">
    <h2>PCFC Kit Store</h2>
    <p>Enter the access code to continue</p>
    <input type="password" inputmode="numeric" id="lockInput" maxlength="12" autocomplete="off">
    <div class="err" id="lockErr"></div>
    <button class="btn" id="lockSubmit" type="button">Unlock</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Tabs
  // ---------------------------------------------------------------
  var TABS = [
    { id: "dashboard", label: "Dashboard" },
    { id: "checkout",  label: "Check Out" },
    { id: "checkin",   label: "Check In" },
    { id: "history",   label: "History" },
    { id: "equipment", label: "Equipment" },
    { id: "settings",  label: "Settings" }
  ];

  var state = {
    activeTab: "dashboard",
    equipment: [],      // {id, type, quantity, size, colour, idTag, status, currentCheckoutId}
    checkouts: [],       // {id, ...}
    checkins: [],
    authorisers: [],
    suggestions: { names: [], teams: [], locations: [] },
    accentColor: null,
    logoDataUrl: null,
    ready: { equipment: false, checkouts: false, checkins: false, settings: false }
  };

  var db = null;
  var equipmentCol, checkoutsCol, checkinsCol, settingsDoc;

  // Transient per-tab local form state (kept out of full re-renders)
  var checkoutForm = { equipmentIds: [], hasSig: false };
  var checkinForm = { equipmentIds: [] };
  var MAX_CASCADE_DEPTH = 3;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  // ---------------------------------------------------------------
  // Utilities
  // ---------------------------------------------------------------
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function todayISODate() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function nowLocalDatetimeValue() {
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function plusDaysISODate(n) {
    var d = new Date();
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function addDaysToISODate(dateStr, n) {
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) d = new Date();
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function hexToRgb(hex) {
    hex = (hex || "").replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(function (c) { return c + c; }).join("");
    var num = parseInt(hex, 16) || 0;
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(function (v) {
      return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
    }).join("");
  }
  function scaleColor(hex, factor) {
    var c = hexToRgb(hex);
    return rgbToHex(c.r * factor, c.g * factor, c.b * factor);
  }
  function contrastText(hex) {
    var c = hexToRgb(hex);
    // relative luminance, simplified
    var lum = (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) / 255;
    return lum > 0.6 ? "#14231C" : "#FFFFFF";
  }

  var APPEARANCE_TOKENS = ["--pitch-600", "--pitch-800", "--accent", "--accent-text", "--sidebar-bg", "--focus"];
  var ACCENT_CACHE_KEY = "pcfcKitStoreAccent";
  function applyAppearance() {
    var root = document.documentElement;
    if (!state.accentColor) {
      APPEARANCE_TOKENS.forEach(function (t) { root.style.removeProperty(t); });
      try { localStorage.removeItem(ACCENT_CACHE_KEY); } catch (e) {}
      return;
    }
    var accent = state.accentColor;
    var sidebar = scaleColor(accent, 0.47);
    var text = contrastText(accent);
    root.style.setProperty("--pitch-600", accent);
    root.style.setProperty("--pitch-800", sidebar);
    root.style.setProperty("--accent", accent);
    root.style.setProperty("--accent-text", text);
    root.style.setProperty("--sidebar-bg", sidebar);
    root.style.setProperty("--focus", accent);
    try { localStorage.setItem(ACCENT_CACHE_KEY, accent); } catch (e) {}
  }
  // Apply a cached colour immediately on load, before the database responds, to avoid a flash of default colours
  (function applyCachedAppearance() {
    var cached = null;
    try { cached = localStorage.getItem(ACCENT_CACHE_KEY); } catch (e) {}
    if (cached) { state.accentColor = cached; applyAppearance(); }
  })();

  var LOGO_CACHE_KEY = "pcfcKitStoreLogo";
  function applyLogo() {
    var img = byId("clubLogo");
    if (!img) return;
    if (state.logoDataUrl) {
      img.src = state.logoDataUrl;
      img.style.display = "";
      try { localStorage.setItem(LOGO_CACHE_KEY, state.logoDataUrl); } catch (e) {}
    } else {
      img.removeAttribute("src");
      img.style.display = "none";
      try { localStorage.removeItem(LOGO_CACHE_KEY); } catch (e) {}
    }
  }
  (function applyCachedLogo() {
    var cached = null;
    try { cached = localStorage.getItem(LOGO_CACHE_KEY); } catch (e) {}
    if (cached) { state.logoDataUrl = cached; applyLogo(); }
  })();
  function fmtDateTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return esc(iso);
    return d.toLocaleDateString(undefined, { day: "2-digit", month: "short" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return esc(iso);
    return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
  }
  function isOverdue(dueDate) {
    if (!dueDate) return false;
    return dueDate < todayISODate();
  }
  function toast(msg, isErr) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.className = isErr ? "show err" : "show";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.className = ""; }, 3200);
  }
  function byId(id) { return document.getElementById(id); }

  function equipmentById(id) {
    for (var i = 0; i < state.equipment.length; i++) if (state.equipment[i].id === id) return state.equipment[i];
    return null;
  }
  function checkoutById(id) {
    for (var i = 0; i < state.checkouts.length; i++) if (state.checkouts[i].id === id) return state.checkouts[i];
    return null;
  }
  // Other equipment currently out under the same checkout action (bundle-mates)
  function bundleMates(equipmentId) {
    var eq = equipmentById(equipmentId);
    var co = eq ? checkoutById(eq.currentCheckoutId) : null;
    if (!co || !co.actionId) return [];
    return state.equipment.filter(function (e) {
      if (e.id === equipmentId || e.status !== "checked_out") return false;
      var otherCo = checkoutById(e.currentCheckoutId);
      return otherCo && otherCo.actionId === co.actionId;
    });
  }

  var firebaseConfig = {
    apiKey: "AIzaSyA_XHsNCCX8KjYNC60rdjf2aQmXoRi-Zic",
    authDomain: "pcfc-kit-store.firebaseapp.com",

  async function initDb() {
    try {
      if (!window.firebase) throw new Error("Firebase SDK did not load");
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch (e) {
      console.error(e);
      db = null;
    }
    if (!db) {
      showConnFail();
      return;
    }
    equipmentCol = db.collection("equipment");
    checkoutsCol = db.collection("checkouts");
    checkinsCol = db.collection("checkins");
    settingsDoc = db.doc("config/settings");

    equipmentCol.onSnapshot(function (snap) {
      state.equipment = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.equipment = true;
      onEquipmentChange();
    }, dbErr);

    checkoutsCol.onSnapshot(function (snap) {
      state.checkouts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.checkouts = true;
      onCheckoutsChange();
    }, dbErr);

    checkinsCol.onSnapshot(function (snap) {
      state.checkins = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.checkins = true;
      onCheckinsChange();
    }, dbErr);

    settingsDoc.onSnapshot(function (snap) {
      var data = snap.exists ? snap.data() : {};
      state.authorisers = (data && data.authorisers) || [];
      state.suggestions = {
        names: (data && data.suggestNames) || [],
        teams: (data && data.suggestTeams) || [],
        locations: (data && data.suggestLocations) || []
      };
      state.accentColor = (data && data.accentColor) || null;
      state.logoDataUrl = (data && data.logoDataUrl) || null;
      applyAppearance();
      applyLogo();
      state.ready.settings = true;
      onSettingsChange();
    }, dbErr);
  }

  function dbErr(e) {
    console.error("db error", e);
    toast("Lost connection to the equipment database. Check your internet connection.", true);
  }

  function showConnFail() {
    var block = document.createElement("div");
    block.className = "conn-block";
    block.innerHTML =
      '<div class="box"><h2>Can\u2019t connect to the equipment database</h2>' +
      '<p>Check your internet connection and reload the page. If this keeps happening, the Firebase project may need checking.</p></div>';
    document.body.appendChild(block);
  }

  // Quick day-offset buttons for the due date, anchored to the check-out date,
  // so picking a near-term due date rarely needs the native calendar at all.
  function renderDueDateQuickPicks() {
    var quickWrap = byId("coDueQuick");
    var dueInput = byId("coDue");
    var timeInput = byId("coTime");
    if (!quickWrap || !dueInput || !timeInput) return;
    var baseDateStr = (timeInput.value || nowLocalDatetimeValue()).slice(0, 10);
    dueInput.min = baseDateStr;
    var offsets = [3, 7, 14];
    quickWrap.innerHTML = offsets.map(function (n) {
      var target = addDaysToISODate(baseDateStr, n);
      return '<button type="button" class="quick-pick-btn" data-days="' + n + '">+' + n + 'd</button>';
    }).join("");
    Array.prototype.forEach.call(quickWrap.querySelectorAll(".quick-pick-btn"), function (b) {
      b.addEventListener("click", function () {
        dueInput.value = addDaysToISODate(baseDateStr, parseInt(b.getAttribute("data-days"), 10));
      });
    });
  }

  function renderCheckoutPicker() {
    var list = byId("coEquipmentList");
    if (!list) return;
    var q = (byId("coSearch") && byId("coSearch").value || "").toLowerCase().trim();
    var matches = function (e) {
      if (!q) return true;
      return (e.type || "").toLowerCase().indexOf(q) > -1 || (e.idTag || "").toLowerCase().indexOf(q) > -1;
    };
    var inStore = state.equipment.filter(function (e) { return e.status === "in_store" && matches(e); });
    var handoverAll = state.equipment.filter(function (e) { return e.status === "checked_out" && matches(e); });
    var handover = handoverAll.filter(function (e) {
      var co = checkoutById(e.currentCheckoutId);
      return co && (co.cascadeDepth || 0) < MAX_CASCADE_DEPTH;
    });
    var atCap = handoverAll.length - handover.length;

    // don't drop a selection just because of the current search filter — only if it's no longer eligible at all
    var eligibleIds = {};
    state.equipment.forEach(function (e) {
      if (e.status === "in_store") { eligibleIds[e.id] = true; return; }
      var co = checkoutById(e.currentCheckoutId);
      if (e.status === "checked_out" && co && (co.cascadeDepth || 0) < MAX_CASCADE_DEPTH) eligibleIds[e.id] = true;
    });
    checkoutForm.equipmentIds = checkoutForm.equipmentIds.filter(function (id) { return eligibleIds[id]; });

    var countEl = byId("coSelCount");
    if (countEl) countEl.textContent = checkoutForm.equipmentIds.length ? "(" + checkoutForm.equipmentIds.length + " selected)" : "";

    if (!state.ready.equipment) {
      list.innerHTML = '<div class="picker-empty">Loading…</div>';
      return;
    }

    function rowHtml(e, subLabel) {
      var sel = checkoutForm.equipmentIds.indexOf(e.id) > -1;
      return '<div class="picker-item' + (sel ? ' selected' : '') + '" data-id="' + esc(e.id) + '">' +
        '<input type="checkbox" style="width:auto;flex-shrink:0;" ' + (sel ? "checked" : "") + ' data-id="' + esc(e.id) + '">' +
        '<div class="info"><div class="t">' + esc(e.type) + '</div><div class="m">' + esc(subLabel) + '</div></div>' +
        '<span class="tag-chip">' + esc(e.idTag) + '</span>' +
        '</div>';
    }

    var html = "";
    if (!inStore.length && !handover.length) {
      html = '<div class="picker-empty">' + (q ? "No matching items." : "Nothing available to check out.") + '</div>';
    } else {
      if (inStore.length) {
        html += '<div class="picker-section-label">In store</div>';
        html += inStore.map(function (e) { return rowHtml(e, [e.size, e.colour].filter(Boolean).join(" · ")); }).join("");
      }
      if (handover.length) {
        html += '<div class="picker-section-label">Hand over from another team</div>';
        html += handover.map(function (e) {
          var co = checkoutById(e.currentCheckoutId);
          var hopsLeft = MAX_CASCADE_DEPTH - ((co && co.cascadeDepth) || 0);
          return rowHtml(e, "currently with " + (co ? co.name + " (" + co.team + ")" : "?") + " · " + hopsLeft + " hand-over" + (hopsLeft === 1 ? "" : "s") + " left after this");
        }).join("");
      }
      if (atCap) {
        html += '<div class="picker-empty">' + atCap + ' item(s) have reached the ' + MAX_CASCADE_DEPTH + '-hand-over limit and must be checked in to store first.</div>';
      }
    }
    list.innerHTML = html;
    Array.prototype.forEach.call(list.querySelectorAll(".picker-item"), function (row) {
      row.addEventListener("click", function () {
        var id = row.getAttribute("data-id");
        var idx = checkoutForm.equipmentIds.indexOf(id);
        if (idx > -1) checkoutForm.equipmentIds.splice(idx, 1);
        else checkoutForm.equipmentIds.push(id);
        renderCheckoutPicker();
      });
    });
  }

  function refreshAuthoriserSelect(selectId) {
    var sel = byId(selectId);
    if (!sel) return;
    var prev = sel.value;
    if (!state.authorisers.length) {
      sel.innerHTML = '<option value="">No authorisers set up — add them in Settings</option>';
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    sel.innerHTML = state.authorisers.map(function (a) { return '<option value="' + esc(a) + '">' + esc(a) + '</option>'; }).join("");
    if (prev && state.authorisers.indexOf(prev) > -1) sel.value = prev;
  }

  function renderSuggestionDatalists() {
    var map = { nameList: state.suggestions.names, teamList: state.suggestions.teams, locationList: state.suggestions.locations };
    Object.keys(map).forEach(function (id) {
      var el = byId(id);
      if (!el) return;
      el.innerHTML = map[id].map(function (v) { return '<option value="' + esc(v) + '">'; }).join("");
    });
  }

  var MAX_SUGGESTIONS = 40;
  function withSuggestion(list, value) {
    value = (value || "").trim();
    if (!value) return list;
    var lower = value.toLowerCase();
    var without = list.filter(function (v) { return v.toLowerCase() !== lower; });
    return [value].concat(without).slice(0, MAX_SUGGESTIONS);
  }

  async function saveBorrowerSuggestions(name, team, location) {
    if (!db) return;
    try {
      await settingsDoc.set({
        suggestNames: withSuggestion(state.suggestions.names, name),
        suggestTeams: withSuggestion(state.suggestions.teams, team),
        suggestLocations: withSuggestion(state.suggestions.locations, location)
      }, { merge: true });
    } catch (e) {
      console.error("Couldn\u2019t save suggestions", e);
    }
  }

  function showBanner(elId, msg, kind) {
    var el = byId(elId);
    if (!el) return;
    if (!msg) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="banner ' + (kind || "error") + '">' + esc(msg) + '</div>';
  }

  async function submitCheckout() {
    showBanner("coBanner", "");
    if (!db) { toast("Not connected to shared storage.", true); return; }
    if (!checkoutForm.equipmentIds.length) { showBanner("coBanner", "Choose at least one item to check out first."); return; }
    var name = byId("coName").value.trim();
    var team = byId("coTeam").value.trim();
    var location = byId("coLocation").value.trim();
    var time = byId("coTime").value;
    var due = byId("coDue").value;
    var authoriser = byId("coAuthoriser").value;
    var agreed = byId("coAgree").checked;

    if (!name) return showBanner("coBanner", "Enter the borrower\u2019s name.");
    if (!team) return showBanner("coBanner", "Enter the team.");
    if (!location) return showBanner("coBanner", "Enter the location it\u2019ll be used at.");
    if (!time) return showBanner("coBanner", "Set the check-out time.");
    if (!due) return showBanner("coBanner", "Set a check-in due date.");
    if (!authoriser) return showBanner("coBanner", "Choose who\u2019s checking it out (add authorisers in Settings if the list is empty).");
    if (!checkoutForm.hasSig) return showBanner("coBanner", "Get a signature before completing the check-out.");
    if (!agreed) return showBanner("coBanner", "Tick the box to confirm the terms have been accepted.");

    var btn = byId("coSubmit");
    btn.disabled = true;
    try {
      var sigData = byId("sigCanvas").toDataURL("image/png");
      var nowIso = new Date().toISOString();
      var actionId = uid();
      var freshCount = 0;
      var handoverCount = 0;
      var skipped = [];
      var cappedSkipped = [];

      for (var i = 0; i < checkoutForm.equipmentIds.length; i++) {
        var equipmentId = checkoutForm.equipmentIds[i];
        var eqRef = equipmentCol.doc(equipmentId);
        var snap = await eqRef.get();
        if (!snap.exists) { skipped.push(equipmentId); continue; }
        var eqData = snap.data();
        var snapshot = { type: eqData.type, size: eqData.size || "", colour: eqData.colour || "", idTag: eqData.idTag };
        var checkoutRef = checkoutsCol.doc();

        if (eqData.status === "in_store") {
          // fresh check-out from the store
          await eqRef.update({ status: "checked_out", currentCheckoutId: checkoutRef.id });
          await checkoutRef.set({
            equipmentId: equipmentId, equipmentSnapshot: snapshot,
            name: name, team: team, location: location,
            checkOutTime: new Date(time).toISOString(), dueDate: due,
            checkedOutBy: authoriser, signature: sigData,
            status: "open", checkinId: null, createdAt: nowIso,
            actionId: actionId, cascadeDepth: 0, precedingCheckoutId: null
          });
          freshCount++;
        } else if (eqData.status === "checked_out" && eqData.currentCheckoutId) {
          // hand-over from whoever currently has it — closes their check-out and opens a new one
          var oldCheckoutId = eqData.currentCheckoutId;
          var oldCheckout = checkoutById(oldCheckoutId);
          var oldDepth = (oldCheckout && oldCheckout.cascadeDepth) || 0;
          if (oldDepth >= MAX_CASCADE_DEPTH) { cappedSkipped.push(equipmentId); continue; }

          var checkinRef = checkinsCol.doc();
          await checkinRef.set({
            equipmentId: equipmentId, checkoutId: oldCheckoutId, equipmentSnapshot: snapshot,
            name: name, team: team, location: location,
            checkInTime: new Date(time).toISOString(), checkedInBy: authoriser,
            createdAt: nowIso, actionId: actionId,
            cascaded: true, cascadedToCheckoutId: checkoutRef.id
          });
          await checkoutRef.set({
            equipmentId: equipmentId, equipmentSnapshot: snapshot,
            name: name, team: team, location: location,
            checkOutTime: new Date(time).toISOString(), dueDate: due,
            checkedOutBy: authoriser, signature: sigData,
            status: "open", checkinId: null, createdAt: nowIso,
            actionId: actionId, cascadeDepth: oldDepth + 1, precedingCheckoutId: oldCheckoutId
          });
          await checkoutsCol.doc(oldCheckoutId).update({ status: "closed", checkinId: checkinRef.id });
          await eqRef.update({ currentCheckoutId: checkoutRef.id }); // status stays "checked_out"
          handoverCount++;
        } else {
          skipped.push(equipmentId);
        }
      }

      var totalDone = freshCount + handoverCount;
      if (!totalDone) {
        showBanner("coBanner", "Those items are no longer available — refresh and pick again.");
        checkoutForm.equipmentIds = [];
        renderCheckoutPicker();
        return;
      }
      var parts = [];
      if (freshCount) parts.push(freshCount + " from store");
      if (handoverCount) parts.push(handoverCount + " handed over");
      var msg = totalDone + " item(s) checked out to " + name + " (" + parts.join(", ") + ").";
      var hadIssues = skipped.length || cappedSkipped.length;
      if (skipped.length) msg += " " + skipped.length + " item(s) were no longer available.";
      if (cappedSkipped.length) msg += " " + cappedSkipped.length + " item(s) hit the " + MAX_CASCADE_DEPTH + "-hand-over limit — check them in to store first.";
      toast(msg, !!hadIssues);
      saveBorrowerSuggestions(name, team, location);
      renderCheckoutTab(byId("main"));
    } catch (e) {
      console.error(e);
      showBanner("coBanner", "Something went wrong saving the check-out. Please try again.");
    } finally {
      btn.disabled = false;
    }
  }

  async function submitCheckin() {
    showBanner("ciBanner", "");
    if (!db) { toast("Not connected to shared storage.", true); return; }
    if (!checkinForm.equipmentIds.length) { showBanner("ciBanner", "Choose at least one item to check in first."); return; }
    var name = byId("ciName").value.trim();
    var team = byId("ciTeam").value.trim();
    var location = byId("ciLocation").value.trim();
    var time = byId("ciTime").value;
    var authoriser = byId("ciAuthoriser").value;

    if (!name) return showBanner("ciBanner", "Enter the borrower\u2019s name.");
    if (!team) return showBanner("ciBanner", "Enter the team.");
    if (!location) return showBanner("ciBanner", "Enter the location it was used at.");
    if (!time) return showBanner("ciBanner", "Set the check-in time.");
    if (!authoriser) return showBanner("ciBanner", "Choose who\u2019s checking it in (add authorisers in Settings if the list is empty).");

    var btn = byId("ciSubmit");
    btn.disabled = true;
    try {
      var actionId = uid();
      var nowIso = new Date().toISOString();
      var checkedInNames = [];

      for (var i = 0; i < checkinForm.equipmentIds.length; i++) {
        var equipmentId = checkinForm.equipmentIds[i];
        var eqRef = equipmentCol.doc(equipmentId);
        var snap = await eqRef.get();
        if (!snap.exists || snap.data().status !== "checked_out" || !snap.data().currentCheckoutId) continue;
        var eqData = snap.data();
        var oldCheckoutId = eqData.currentCheckoutId;
        var snapshot = { type: eqData.type, size: eqData.size || "", colour: eqData.colour || "", idTag: eqData.idTag };

        var checkinRef = checkinsCol.doc();
        await checkinRef.set({
          equipmentId: equipmentId,
          checkoutId: oldCheckoutId,
          equipmentSnapshot: snapshot,
          name: name, team: team, location: location,
          checkInTime: new Date(time).toISOString(),
          checkedInBy: authoriser,
          createdAt: nowIso,
          actionId: actionId,
          cascaded: false,
          cascadedToCheckoutId: null
        });
        await checkoutsCol.doc(oldCheckoutId).update({ status: "closed", checkinId: checkinRef.id });
        await eqRef.update({ status: "in_store", currentCheckoutId: null });
        checkedInNames.push(eqData.type + " (" + eqData.idTag + ")");
      }

      if (!checkedInNames.length) {
        showBanner("ciBanner", "Those items have already been checked in. Refresh and pick again.");
        checkinForm.equipmentIds = [];
        renderCheckinPicker();
        return;
      }

      toast((checkedInNames.length > 1 ? checkedInNames.length + " items" : checkedInNames[0]) + " checked in.");
      renderCheckinTab(byId("main"));
    } catch (e) {
      console.error(e);
      showBanner("ciBanner", "Something went wrong saving the check-in. Please try again.");
    } finally {
      btn.disabled = false;
    }
  }

  // =================================================================
  // HISTORY (reconciled check-out / check-in pairs)
  // =================================================================
  function renderHistoryTab(main) {
    main.innerHTML =
      '<h2>History</h2>' +
      '<p class="tab-desc">Each loan is traced from the original check-out through any hand-overs to its return — so you can follow an item\u2019s whole journey in one place, in order.</p>' +
      '<div id="historyChains"></div>';
    renderHistoryTable();
  }

  function checkinById(id) {
    for (var i = 0; i < state.checkins.length; i++) if (state.checkins[i].id === id) return state.checkins[i];
    return null;
  }

  // Walk a chain forward from its originating (cascadeDepth 0) check-out, following
  // hand-overs via checkin.cascadedToCheckoutId, until it's returned to store or is still out.
  function buildLoanChain(startCheckout) {
    var hops = [];
    var current = startCheckout;
    var guard = 0;
    while (current && guard < 20) {
      guard++;
      var ci = current.checkinId ? checkinById(current.checkinId) : null;
      hops.push({ checkout: current, checkin: ci });
      if (ci && ci.cascaded && ci.cascadedToCheckoutId) {
        current = checkoutById(ci.cascadedToCheckoutId);
      } else {
        current = null;
      }
    }
    return hops;
  }

  function renderHistoryTable() {
    var wrap = byId("historyChains");
    if (!wrap) return;
    if (!state.ready.checkouts || !state.ready.checkins) {
      wrap.innerHTML = '<p class="tab-desc">Loading…</p>';
      return;
    }
    var starts = state.checkouts.filter(function (c) { return !c.precedingCheckoutId; })
      .sort(function (a, b) { return (b.checkOutTime || "").localeCompare(a.checkOutTime || ""); });

    if (!starts.length) {
      wrap.innerHTML = '<p class="tab-desc">No loans yet — check something out and its history will appear here.</p>';
      return;
    }

    wrap.innerHTML = starts.map(function (start) {
      var hops = buildLoanChain(start);
      var lastHop = hops[hops.length - 1];
      var stillOut = !lastHop.checkin;
      var eqType = start.equipmentSnapshot ? start.equipmentSnapshot.type : "—";
      var eqTag = start.equipmentSnapshot ? start.equipmentSnapshot.idTag : "—";
      var statusChip = stillOut
        ? '<span class="status-chip checked-out">Currently out</span>'
        : '<span class="status-chip in-store">Returned to store</span>';

      var hopRows = hops.map(function (hop, i) {
        var co = hop.checkout, ci = hop.checkin;
        var overdue = !ci && isOverdue(co.dueDate);
        var line1 = '<strong>' + esc(co.name) + '</strong> (' + esc(co.team) + ') at ' + esc(co.location);
        var line2 = 'Out ' + esc(fmtDateTime(co.checkOutTime)) + ' by ' + esc(co.checkedOutBy) + ' — due ' + esc(fmtDate(co.dueDate));
        var line3;
        if (!ci) {
          line3 = overdue ? '<span style="color:var(--tag-red);font-weight:600;">Still out — overdue</span>' : '<span style="color:var(--text-soft);">Still out</span>';
        } else if (ci.cascaded) {
          line3 = 'Handed over ' + esc(fmtDateTime(ci.checkInTime)) + ' by ' + esc(ci.checkedInBy);
        } else {
          line3 = 'Returned to store ' + esc(fmtDateTime(ci.checkInTime)) + ', checked in by ' + esc(ci.checkedInBy);
        }
        return '<div class="chain-hop">' +
          '<div class="chain-hop-num">' + (i + 1) + '</div>' +
          '<div class="chain-hop-body">' +
            '<div>' + line1 + '</div>' +
            '<div class="chain-hop-meta">' + line2 + '</div>' +
            '<div class="chain-hop-meta">' + line3 + '</div>' +
          '</div>' +
        '</div>';
      }).join('<div class="chain-connector"></div>');

      return '<div class="panel">' +
        '<h3><span>' + esc(eqType) + ' <span class="tag-chip">' + esc(eqTag) + '</span></span> ' + statusChip + '</h3>' +
        '<div class="chain-timeline">' + hopRows + '</div>' +
      '</div>';
    }).join("");
  }

  async function addEquipment() {
    showBanner("eqBanner", "");
    if (!db) { toast("Not connected to shared storage.", true); return; }
    var type = byId("eqType").value.trim();
    var qty = parseInt(byId("eqQty").value, 10);
    var size = byId("eqSize").value.trim();
    var colour = byId("eqColour").value.trim();
    var idTag = byId("eqTag").value.trim();

    if (!type) return showBanner("eqBanner", "Enter a type for this item.");
    if (!idTag) return showBanner("eqBanner", "Enter an ID tag — this is what identifies the item at check-in.");
    if (isNaN(qty) || qty < 1) qty = 1;
    var dup = state.equipment.some(function (e) { return (e.idTag || "").toLowerCase() === idTag.toLowerCase(); });
    if (dup) return showBanner("eqBanner", "That ID tag is already in use. Each item needs a unique tag.");

    var btn = byId("eqAdd");
    btn.disabled = true;
    try {
      var ref = equipmentCol.doc();
      await ref.set({
        type: type, quantity: qty, size: size, colour: colour, idTag: idTag,
        status: "in_store", currentCheckoutId: null, createdAt: new Date().toISOString()
      });
      byId("eqType").value = ""; byId("eqQty").value = "1"; byId("eqSize").value = ""; byId("eqColour").value = ""; byId("eqTag").value = "";
      toast("Added " + type + " to the catalog.");
    } catch (e) {
      console.error(e);
      showBanner("eqBanner", "Couldn\u2019t save that item. Please try again.");
    } finally {
      btn.disabled = false;
    }
  }

  function renderEquipmentTable() {
    var wrap = byId("eqTableWrap");
    if (!wrap) return;
    if (!state.ready.equipment) { wrap.innerHTML = '<p class="tab-desc">Loading…</p>'; return; }
    if (!state.equipment.length) { wrap.innerHTML = '<p class="tab-desc">No equipment in the catalog yet — add your first item above.</p>'; return; }
    var sorted = state.equipment.slice().sort(function (a, b) { return (a.type || "").localeCompare(b.type || ""); });
    wrap.innerHTML =
      '<table><thead><tr><th>Type</th><th>Size</th><th>Colour</th><th>Qty</th><th>ID tag</th><th>Status</th><th></th></tr></thead><tbody>' +
      sorted.map(function (e) {
        var statusChip = e.status === "in_store"
          ? '<span class="status-chip in-store">In store</span>'
          : '<span class="status-chip checked-out">Checked out</span>';
        return '<tr>' +
          '<td>' + esc(e.type) + '</td><td>' + esc(e.size || "—") + '</td><td>' + esc(e.colour || "—") + '</td><td>' + esc(e.quantity != null ? e.quantity : "—") + '</td>' +
          '<td><span class="tag-chip">' + esc(e.idTag) + '</span></td><td>' + statusChip + '</td>' +
          '<td style="white-space:nowrap;">' +
            '<button class="icon-btn" data-dup="' + esc(e.id) + '" type="button" style="color:var(--text-soft);">Duplicate</button>' +
            (e.status === "in_store" ? '<button class="icon-btn" data-del="' + esc(e.id) + '" type="button">Remove</button>' : '') +
          '</td>' +
          '</tr>';
      }).join("") + '</tbody></table>';
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () { removeEquipment(b.getAttribute("data-del"), b); });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-dup]"), function (b) {
      b.addEventListener("click", function () { duplicateEquipment(b.getAttribute("data-dup")); });
    });

  function duplicateEquipment(id) {
    var eq = equipmentById(id);
    if (!eq) return;
    byId("eqType").value = eq.type || "";
    byId("eqQty").value = eq.quantity != null ? eq.quantity : 1;
    byId("eqSize").value = eq.size || "";
    byId("eqColour").value = eq.colour || "";
    byId("eqTag").value = "";
    showBanner("eqBanner", "");
    byId("eqTag").focus();
    byId("eqType").scrollIntoView({ behavior: "smooth", block: "center" });
    toast("Copied \u201C" + eq.type + "\u201D \u2014 give it a new ID tag and save.");
  }

  async function removeEquipment(id, btnEl) {
    if (!db) return;
    var eq = equipmentById(id);
    if (!eq) return;
    if (!window.confirm("Remove \u201C" + eq.type + "\u201D (" + eq.idTag + ") from the catalog?")) return;
    btnEl.disabled = true;
    try {
      var snap = await equipmentCol.doc(id).get();
      if (snap.exists && snap.data().status !== "in_store") {
        toast("That item is checked out — check it in before removing it.", true);
        return;
      }
      await equipmentCol.doc(id).delete();
      toast("Removed " + eq.type + " from the catalog.");
    } catch (e) {
      console.error(e);
      toast("Couldn\u2019t remove that item.", true);
    } finally {
      btnEl.disabled = false;
    }
  }

      '<p class="tab-desc">Manage the people who can appear in the \u201Cchecked out by\u201D / \u201Cchecked in by\u201D dropdowns, the predictive suggestions offered when filling in borrower details, and the site\u2019s branding.</p>' +
      '<div class="panel"><h3>Appearance</h3>' +
        '<p class="tab-desc" style="margin-bottom:10px;">Pick a brand colour and it\u2019s used for buttons, the sidebar, and highlights across the site for everyone \u2014 status colours (in store / checked out / overdue) stay as they are so they\u2019re still easy to read at a glance.</p>' +
        '<div class="field-row" style="align-items:flex-end;">' +
          '<div class="field" style="flex:0 0 auto;"><label for="appAccent">Brand colour</label><input type="color" id="appAccent" value="' + esc(state.accentColor || "#2F6F52") + '" style="width:60px;height:40px;padding:2px;"></div>' +
          '<div><button class="btn" id="appSave" type="button">Save colour</button></div>' +
          '<div><button class="btn secondary" id="appReset" type="button">Reset to default</button></div>' +
        '</div>' +
        '<div id="appBanner"></div>' +
      '</div>' +
      '<div class="panel"><h3>Club badge</h3>' +
        '<p class="tab-desc" style="margin-bottom:10px;">Drop a JPEG, PNG, or similar image in and it\u2019ll show next to the site title for everyone. Resized automatically so it stays quick to load.</p>' +
        '<div class="dropzone" id="logoDropzone" tabindex="0">' +
          '<div id="logoDropzoneText"><strong>Drop a badge here</strong>, or click to choose a file</div>' +
          '<input type="file" id="logoFileInput" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/svg+xml" style="display:none;">' +
        '</div>' +
        '<div id="logoPreviewRow"></div>' +
        '<div id="logoBanner"></div>' +
      '</div>' +
      '<div class="panel"><h3>Authorisers</h3>' +
        '<div class="field-row">' +
          '<div class="field" style="flex:1;"><input type="text" id="authNew" placeholder="Add a name…"></div>' +
          '<div><button class="btn" id="authAdd" type="button">Add</button></div>' +
        '</div>' +
        '<div id="authList"></div>' +
      '</div>' +
      suggestionSectionHtml("names", "Remembered names") +
      suggestionSectionHtml("teams", "Remembered teams") +
      suggestionSectionHtml("locations", "Remembered locations");
    byId("authAdd").addEventListener("click", addAuthoriser);
    byId("authNew").addEventListener("keydown", function (e) { if (e.key === "Enter") addAuthoriser(); });
    renderAuthoriserList();
    renderSuggestionLists();
    ["names", "teams", "locations"].forEach(function (field) {
      var clearBtn = byId("clear_" + field);
      if (clearBtn) clearBtn.addEventListener("click", function () { clearSuggestions(field); });
    });
    byId("appAccent").addEventListener("input", function () {
      // live preview as they pick, before saving
      var prev = state.accentColor;
      state.accentColor = byId("appAccent").value;
      applyAppearance();
      state.accentColor = prev;
    });
    byId("appSave").addEventListener("click", saveAccentColor);
    byId("appReset").addEventListener("click", resetAccentColor);
    setupLogoDropzone();
    renderLogoPreview();
  }

  // ---------------------------------------------------------------
  // Club badge upload
  // ---------------------------------------------------------------
  var LOGO_MAX_DIMENSION = 240;
  var LOGO_MAX_SOURCE_BYTES = 15 * 1024 * 1024; // 15MB — generous cap on the original file before we resize it

  function setupLogoDropzone() {
    var zone = byId("logoDropzone");
    var input = byId("logoFileInput");
    if (!zone || !input) return;
    zone.addEventListener("click", function () { input.click(); });
    zone.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
    input.addEventListener("change", function () { if (input.files && input.files[0]) handleLogoFile(input.files[0]); });
    ["dragover", "dragenter"].forEach(function (evt) {
      zone.addEventListener(evt, function (e) { e.preventDefault(); zone.classList.add("dragover"); });
    });
    ["dragleave", "dragend"].forEach(function (evt) {
      zone.addEventListener(evt, function (e) { zone.classList.remove("dragover"); });
    });
    zone.addEventListener("drop", function (e) {
      e.preventDefault();
      zone.classList.remove("dragover");
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleLogoFile(file);
    });
  }

  function handleLogoFile(file) {
    showBanner("logoBanner", "");
    if (!/^image\//.test(file.type)) {
      return showBanner("logoBanner", "That doesn\u2019t look like an image file — try a JPEG, PNG, WebP, GIF or SVG.");
    }
    if (file.size > LOGO_MAX_SOURCE_BYTES) {
      return showBanner("logoBanner", "That file\u2019s a bit large — try something under 15MB.");
    }
    var textEl = byId("logoDropzoneText");
    if (textEl) textEl.innerHTML = "Processing image…";

    var reader = new FileReader();
    reader.onerror = function () { showBanner("logoBanner", "Couldn\u2019t read that file. Please try again."); resetDropzoneText(); };
    reader.onload = function () {
      if (file.type === "image/svg+xml") {
        // SVGs are already tiny and vector — store as-is rather than rasterizing
        saveLogo(reader.result);
        return;
      }
      var img = new Image();
      img.onload = function () {
        try {
          var canvas = document.createElement("canvas");
          var scale = Math.min(1, LOGO_MAX_DIMENSION / Math.max(img.width, img.height));
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL("image/png");
          saveLogo(dataUrl);
        } catch (e) {
          console.error(e);
          showBanner("logoBanner", "Couldn\u2019t process that image. Please try a different file.");
          resetDropzoneText();
        }
      };
      img.onerror = function () { showBanner("logoBanner", "Couldn\u2019t read that image. Please try a different file."); resetDropzoneText(); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function resetDropzoneText() {
    var textEl = byId("logoDropzoneText");
    if (textEl) textEl.innerHTML = '<strong>Drop a badge here</strong>, or click to choose a file';
  }

  async function saveLogo(dataUrl) {
    if (!db) { showBanner("logoBanner", "Not connected to shared storage."); resetDropzoneText(); return; }
    if (dataUrl.length > 900000) {
      showBanner("logoBanner", "That image is still too large after resizing — try a simpler image.");
      resetDropzoneText();
      return;
    }
    try {
      await settingsDoc.set({ logoDataUrl: dataUrl }, { merge: true });
      toast("Club badge updated for everyone.");
    } catch (e) {
      console.error(e);
      showBanner("logoBanner", "Couldn\u2019t save that image. Please try again.");
    } finally {
      resetDropzoneText();
    }
  }

  async function removeLogo() {
    if (!db) { toast("Not connected to shared storage.", true); return; }
    try {
      await settingsDoc.set({ logoDataUrl: null }, { merge: true });
      toast("Club badge removed.");
    } catch (e) {
      console.error(e);
      toast("Couldn\u2019t remove the badge.", true);
    }
  }

  function renderLogoPreview() {
    var row = byId("logoPreviewRow");
    if (!row) return;
    if (!state.logoDataUrl) { row.innerHTML = ""; return; }
    row.innerHTML =
      '<div class="logo-preview-row">' +
        '<img src="' + state.logoDataUrl.replace(/"/g, "&quot;") + '" alt="Current club badge">' +
        '<button class="btn secondary small" id="logoRemove" type="button">Remove badge</button>' +
      '</div>';
    byId("logoRemove").addEventListener("click", removeLogo);
  }

  async function saveAccentColor() {
    if (!db) { toast("Not connected to shared storage.", true); return; }
    var hex = byId("appAccent").value;
    showBanner("appBanner", "");
    try {
      await settingsDoc.set({ accentColor: hex }, { merge: true });
      toast("Colour scheme saved for everyone.");
    } catch (e) {
      console.error(e);
      showBanner("appBanner", "Couldn\u2019t save that colour. Please try again.");
    }
  }

  async function resetAccentColor() {
    if (!db) { toast("Not connected to shared storage.", true); return; }
    try {
      await settingsDoc.set({ accentColor: null }, { merge: true });
      byId("appAccent").value = "#2F6F52";
      toast("Reset to the default colours.");
    } catch (e) {
      console.error(e);
      toast("Couldn\u2019t reset the colour scheme.", true);
    }
  }

  function suggestionSectionHtml(field, title) {
    return '<div class="panel"><h3>' + esc(title) + ' <button class="icon-btn small" id="clear_' + field + '" type="button" style="font-weight:400;">Clear all</button></h3>' +
      '<p class="tab-desc" style="margin-bottom:10px;">Picked up automatically from check-outs, and offered as suggestions while typing. Remove individual typos below.</p>' +
      '<div id="sugg_' + field + '"></div>' +
    '</div>';
  }

  function renderSuggestionLists() {
    ["names", "teams", "locations"].forEach(function (field) {
      var wrap = byId("sugg_" + field);
      if (!wrap) return;
      var list = state.suggestions[field] || [];
      if (!state.ready.settings) { wrap.innerHTML = '<p class="tab-desc">Loading…</p>'; return; }
      if (!list.length) { wrap.innerHTML = '<p class="tab-desc">None remembered yet.</p>'; return; }
      wrap.innerHTML = list.map(function (v) {
        return '<div class="authoriser-row"><span>' + esc(v) + '</span><button class="icon-btn" data-sugg-rm="' + esc(field) + '|' + esc(v) + '" type="button">Remove</button></div>';
      }).join("");
      Array.prototype.forEach.call(wrap.querySelectorAll("[data-sugg-rm]"), function (b) {
        b.addEventListener("click", function () {
          var parts = b.getAttribute("data-sugg-rm").split("|");
          removeSuggestion(parts[0], parts.slice(1).join("|"));
        });
      });
    });
  }

  var SUGGESTION_DB_FIELD = { names: "suggestNames", teams: "suggestTeams", locations: "suggestLocations" };

  async function removeSuggestion(field, value) {
    if (!db) return;
    var updated = (state.suggestions[field] || []).filter(function (v) { return v !== value; });
    try {
      var payload = {};
      payload[SUGGESTION_DB_FIELD[field]] = updated;
      await settingsDoc.set(payload, { merge: true });
    } catch (e) {
      console.error(e);
      toast("Couldn\u2019t remove that entry.", true);
    }
  }

  async function clearSuggestions(field) {
    if (!db) return;
    if (!window.confirm("Clear all remembered " + field + "?")) return;
    try {
      var payload = {};
      payload[SUGGESTION_DB_FIELD[field]] = [];
      await settingsDoc.set(payload, { merge: true });
    } catch (e) {
      console.error(e);
      toast("Couldn\u2019t clear that list.", true);
    }
  }

  function renderAuthoriserList() {
    var wrap = byId("authList");
    if (!wrap) return;
    if (!state.ready.settings) { wrap.innerHTML = '<p class="tab-desc">Loading…</p>'; return; }
    if (!state.authorisers.length) { wrap.innerHTML = '<p class="tab-desc">No authorisers yet — add the names of admins who\u2019ll process check-outs and check-ins.</p>'; return; }
    wrap.innerHTML = state.authorisers.map(function (a) {
      return '<div class="authoriser-row"><span>' + esc(a) + '</span><button class="icon-btn" data-rm="' + esc(a) + '" type="button">Remove</button></div>';
    }).join("");
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-rm]"), function (b) {
      b.addEventListener("click", function () { removeAuthoriser(b.getAttribute("data-rm")); });
    });
  }

  async function addAuthoriser() {
    if (!db) { toast("Not connected to shared storage.", true); return; }
    var input = byId("authNew");
    var name = input.value.trim();
    if (!name) return;
    if (state.authorisers.some(function (a) { return a.toLowerCase() === name.toLowerCase(); })) {
      toast("That name is already in the list.", true);
      return;
    }
    var updated = state.authorisers.concat([name]);
    try {
      await settingsDoc.set({ authorisers: updated }, { merge: true });
      input.value = "";
    } catch (e) {
      console.error(e);
      toast("Couldn\u2019t save that name.", true);
    }
  }

  async function removeAuthoriser(name) {
    if (!db) return;
    var updated = state.authorisers.filter(function (a) { return a !== name; });
    try {
      await settingsDoc.set({ authorisers: updated }, { merge: true });
    } catch (e) {
      console.error(e);
      toast("Couldn\u2019t remove that name.", true);
    }
  }

  // =================================================================
  // Signature pad
  // =================================================================
  function setupSignaturePad(canvasId, clearBtnId, onChange) {
    var canvas = byId(canvasId);
    var ctx = canvas.getContext("2d");
    var drawing = false;
    var hasDrawn = false;
    var last = null;

    function resize() {
      if (!canvas.isConnected) { window.removeEventListener("resize", resize); return; }
      var rect = canvas.getBoundingClientRect();
      var ratio = window.devicePixelRatio || 1;
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.strokeStyle = "#1B231F";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }
    resize();
    window.addEventListener("resize", resize);

    function pos(evt) {
      var rect = canvas.getBoundingClientRect();
      var cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
      var cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
      return { x: cx, y: cy };
    }
    function start(evt) {
      evt.preventDefault();
      drawing = true;
      last = pos(evt);
    }
    function move(evt) {
      if (!drawing) return;
      evt.preventDefault();
      var p = pos(evt);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      if (!hasDrawn) { hasDrawn = true; onChange(true); }
    }
    function end() { drawing = false; }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", end);

    byId(clearBtnId).addEventListener("click", function () {
      resize();
      hasDrawn = false;
      onChange(false);
    });
  }

  // ---------------------------------------------------------------
  // Lock screen
  // ---------------------------------------------------------------
  var ACCESS_CODE = "160363";
  var UNLOCK_KEY = "pcfcKitStoreUnlocked";

  function boot() {
    renderNav();
    renderMain();
    renderStatStrip();
    initDb();
  }

  function tryUnlock() {
    var input = byId("lockInput");
    var val = input.value.trim();
    if (val === ACCESS_CODE) {
      try { localStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {}
      byId("lockScreen").remove();
      boot();
    } else {
      byId("lockErr").textContent = "Incorrect code — try again.";
      var box = byId("lockBox");
      box.classList.remove("shake");
      void box.offsetWidth;
      box.classList.add("shake");
      input.value = "";
      input.focus();
    }
  }

  function initLockScreen() {
    var alreadyUnlocked = false;
    try { alreadyUnlocked = localStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) {}
    if (alreadyUnlocked) {
      byId("lockScreen").remove();
      boot();
      return;
    }
    byId("lockSubmit").addEventListener("click", tryUnlock);
    byId("lockInput").addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
    byId("lockInput").focus();
  }

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  initLockScreen();
})();
</script>
